<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seminar Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .container { background: #1e293b; padding: 20px; border-radius: 10px; text-align: center; max-width: 400px; width: 100%; }
    #reader { width: 100%; margin-top: 15px; border-radius: 8px; background: white; }
    #status { margin-top: 15px; padding: 10px; border-radius: 5px; display: none; font-weight: bold; }
    .success { background: #065f46; color: white; }
    .warning { background: #b45309; color: white; }
    .error { background: #991b1b; color: white; }
  </style>
</head>
<body>

  <div class="container">
    <h2>QR Check-in</h2>
    <div id="reader"></div>
    <div id="status"></div>
  </div>

  <script>
    // ⚠️ REPLACE THE LINK BELOW WITH YOUR GOOGLE APPS SCRIPT URL
    const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwtPwPHzHROlNnIaArYZcihGCOmOaeHczEmrKes-2JUvLW0rubnC46FwPhWEQ38IF4ucQ/exec";

    const statusEl = document.getElementById("status");
    let isProcessing = false;

    function showStatus(msg, type) {
      statusEl.style.display = "block";
      statusEl.className = type;
      statusEl.innerText = msg;
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      showStatus("Saving...", "warning");

      let data = {};
      try { data = JSON.parse(decodedText); } 
      catch (e) { data = { name: decodedText, id: decodedText }; }

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(data)
        });
        const res = await response.json();
        
        if (res.status === "success") showStatus("✅ " + res.message, "success");
        else if (res.status === "duplicate") showStatus("⚠️ " + res.message, "warning");
        else showStatus("❌ Error", "error");
      } catch (err) {
        showStatus("❌ Connection failed", "error");
      }

      setTimeout(() => { isProcessing = false; }, 3000);
    }

    const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    scanner.render(onScanSuccess);
  </script>
</body>
</html>
